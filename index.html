<!DOCTYPE html>
<html lang="fr"> <!-- Langue définie en français pour correspondre aux commentaires et au public cible -->
<head>
    <meta charset="UTF-8"> <!-- Encodage des caractères pour supporter les accents et symboles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adaptation pour mobile -->
    <title>Mon Portfolio - CIMEN</title> <!-- Titre de la page -->
    <!-- CSS de Bootstrap (chargé depuis un CDN, c'est-à-dire un serveur externe) -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+IE:wght@100..400&family=Saira+Stencil:ital,wght@0,100..900;1,100..900&family=Strichpunkt+Sans:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Ton fichier CSS, chargé APRÈS Bootstrap pour pouvoir le surcharger -->

  </head>
<body>
    <!-- En-tête de la page : navbar Bootstrap -->
    <!-- navbar-expand-md = le menu s'affiche en entier à partir de "medium" (768px),
         et se replie dans le burger en dessous -->
    <header class="header container">
        <nav class="navbar navbar-expand-md navbar-light">
            <div class="container-fluid">
                <!-- Le titre du site sert de "marque" (brand) -->
                <a class="navbar-brand" href="#"><h1>CIMEN</h1></a>

                <!-- Le bouton burger : visible uniquement quand le menu est replié.
                     data-bs-toggle et data-bs-target disent à Bootstrap quel bloc ouvrir/fermer -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Ouvrir le menu">
                    <span class="navbar-toggler-icon"></span> <!-- Les 3 barres du burger -->
                </button>

                <!-- Le menu repliable. L'id "menuPrincipal" correspond au data-bs-target ci-dessus -->
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto"> <!-- ms-auto pousse le menu vers la droite -->
                        <li class="nav-item"><a class="nav-link" href="#travail">Mon travail</a></li>
                        <li class="nav-item"><a class="nav-link" href="#contact">Demande de renseignement</a></li>
                        <li class="nav-item"><a class="nav-link" href="https://benoit-korben.github.io/EFAP-PROJET/index2.html">À propos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <hr> <!-- Ligne horizontale pour séparer les sections -->

    <!-- Section principale avec image et texte -->
    <main class="container">
        <img src="images/flowers.jpg" alt="Photo de fleurs sur fond gris" class="full_width"> <!-- Image pleine largeur -->
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Aliquid corporis dolor eligendi consequatur optio quod officia ducimus totam nisi quasi? Delectus impedit dolorum iste, et dolores ea veritatis unde blanditiis!</p>
    </main>

    <!-- Galerie d'images -->
    <section class="gallery">
        <img src="images/Cactus-rotin-naturel.jpg" alt="Cactus en rotin naturel"> <!-- Image avec description alternative -->
        <img src="images/cactus_scultpure.jpg" alt="Sculpture de cactus"> <!-- Correction du nom du fichier (ajout de l'extension .jpg) -->
    </section>

    <!-- Section du formulaire de contact -->
    <section id="contact" class="contact container">
        <h2>Contactez-moi</h2> <!-- Titre de la section -->
        <form action="#" method="post"> <!-- Formulaire avec méthode POST (à adapter selon ton backend) -->
            <!-- Champ pour le nom -->
            <div class="form-group">
                <label for="nom">Nom :</label> <!-- Étiquette pour le champ "Nom" -->
                <input type="text" id="nom" name="nom" required> <!-- Champ texte obligatoire -->
            </div>

            <!-- Champ pour le prénom -->
            <div class="form-group">
                <label for="prenom">Prénom :</label> <!-- Étiquette pour le champ "Prénom" -->
                <input type="text" id="prenom" name="prenom" required> <!-- Champ texte obligatoire -->
            </div>

            <!-- Champ pour l'email -->
            <div class="form-group">
                <label for="email">Email :</label> <!-- Étiquette pour le champ "Email" -->
                <input type="email" id="email" name="email" required> <!-- Champ email obligatoire -->
            </div>

            <!-- Champ pour le numéro de téléphone -->
            <div class="form-group">
                <label for="telephone">Numéro de téléphone :</label> <!-- Étiquette pour le champ "Téléphone" -->
                <input type="tel" id="telephone" name="telephone"> <!-- Champ téléphone (non obligatoire) -->
            </div>

            <!-- Bouton de soumission -->
            <button type="submit" class="bouton-submit">Envoyer</button> <!-- Bouton pour soumettre le formulaire -->
        </form>
    </section>

    <!-- JavaScript de Bootstrap : indispensable pour que le burger s'ouvre et se ferme.
         C'est du code fourni par Bootstrap, tu n'as rien à écrire toi-même. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
